schemaVersion: 1
app:
  name: homepage-sample
  description: Timer TODO homepage compatible with LabWebSystem deployment
repository:
  url: https://github.com/LabWebSystem/Samples-Homepage.git
  defaultBranch: main
deployment:
  composePath: docker-compose.yml
  mode: standard
  keepVolumesOnRebuild: true
exposure:
  service: web
  port: 4173
  hostname: homepage.lab.localhost
devices:
  required: []
env:
  required: []
  defaults:
    APPDATA_ROOT: ../../appdata/homepage-sample
    CORS_ORIGIN: "*"
    VITE_API_BASE_URL: /
    VITE_PROXY_TARGET: http://api:8787
profiles:
  default: dev-sim
