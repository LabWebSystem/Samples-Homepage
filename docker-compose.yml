services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homepage
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepage -d homepage"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      network: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://homepage:homepage@db:5432/homepage
      CORS_ORIGIN: http://localhost:5180
    ports:
      - "8787:8787"
    networks:
      - frontend
      - backend

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: http://localhost:8787
    depends_on:
      - api
    ports:
      - "5180:4173"
    networks:
      - frontend

volumes:
  db-data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge