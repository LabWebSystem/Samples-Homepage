services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homepage}
      POSTGRES_USER: ${POSTGRES_USER:-homepage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homepage}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homepage} -d ${POSTGRES_DB:-homepage}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://homepage:homepage@db:5432/homepage
      CORS_ORIGIN: http://localhost:5180
    ports:
      - "8787:8787"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5180:4173"

volumes:
  db-data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge