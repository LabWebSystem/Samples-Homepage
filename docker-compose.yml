services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Mount the parent path and keep the actual cluster in its pgdata child.
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-homepage}
      POSTGRES_USER: ${POSTGRES_USER:-homepage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homepage}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homepage} -d ${POSTGRES_DB:-homepage}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${APPDATA_ROOT:-data/}:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      network: host
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://${POSTGRES_USER:-homepage}:${POSTGRES_PASSWORD:-homepage}@db:5432/${POSTGRES_DB:-homepage}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    expose:
      - "8787"
    networks:
      - backend
      - frontend

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://api:8787}
    expose:
      - "4173"
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
